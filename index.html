<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Missoni Activewear - Catalog</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Helvetica', sans-serif; background-color: #000; }
        
        #scan-button {
            display: none;
            position: fixed;
            bottom: 15%;
            left: 50%;
            transform: translateX(-50%);
            padding: 18px 35px;
            background-color: #ff0080;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            z-index: 100;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            letter-spacing: 1px;
        }

        #pdf-container {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            z-index: 200;
        }

        #pdf-frame {
            width: 100%;
            height: 100%;
            border: none;
        }

        #close-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #333;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 5px;
            z-index: 300;
        }
    </style>
</head>
<body>
    
    <button id="scan-button">OPEN MISSONI CATALOG</button>

    <div id="pdf-container">
        <button id="close-btn">Close X</button>
        <iframe id="pdf-frame" src=""></iframe>
    </div>

    <a-scene mindar-image="imageTargetSrc: ./targets.mind; uiScanning: yes;" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
        <a-entity id="my-target" mindar-image-target="targetIndex: 0">
            <a-ring color="#ff0080" radius-inner="0.45" radius-outer="0.5" position="0 0 0"></a-ring>
        </a-entity>
    </a-scene>

    <script>
        const targetElement = document.querySelector('#my-target');
        const btn = document.querySelector('#scan-button');
        const container = document.querySelector('#pdf-container');
        const frame = document.querySelector('#pdf-frame');
        const close = document.querySelector('#close-btn');

        targetElement.addEventListener("targetFound", () => {
            btn.style.display = "block";
        });

        btn.addEventListener("click", () => {
            const currentUrl = window.location.href.replace('index.html', '');
            const pdfUrl = currentUrl + "database.pdf";
            
            frame.src = "https://docs.google.com/viewer?url=" + encodeURIComponent(pdfUrl) + "&embedded=true";
            
            container.style.display = "block";
            btn.style.display = "none";
        });

        close.addEventListener("click", () => {
            container.style.display = "none";
            frame.src = "";
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Missoni x Monaco | AR</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; background: #000; }

        #loading-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 1000;
            transition: opacity 1.5s ease;
        }
        #loading-screen h1 { color: white; letter-spacing: 8px; text-transform: uppercase; font-weight: 200; margin-bottom: 10px; }
        
        #scan-button {
            display: none; position: fixed; bottom: 12%; left: 50%;
            transform: translateX(-50%); padding: 20px 40px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            color: white; border: 1px solid rgba(255, 255, 255, 0.3);
            font-size: 14px; letter-spacing: 4px; text-transform: uppercase;
            z-index: 100; cursor: pointer;
        }

        #pdf-container {
            display: none; position: fixed; top: 0; left: 0; 
            width: 100%; height: 100%; background: white; z-index: 200;
        }
        #pdf-frame { width: 100%; height: 100%; border: none; }
        
        #close-btn {
            position: absolute; top: 20px; right: 20px;
            background: #000; color: #fff; border: none;
            padding: 10px 15px; text-transform: uppercase; font-size: 10px;
            letter-spacing: 2px; z-index: 300;
        }
    </style>
</head>
<body>

    <div id="loading-screen">
        <h1>Missoni x Monaco</h1>
        <div style="width: 30px; height: 1px; background: #ff0080;"></div>
    </div>
    
    <button id="scan-button">Explore Catalog</button>

    <div id="pdf-container">
        <button id="close-btn">Close</button>
        <iframe id="pdf-frame" src=""></iframe>
    </div>

    <a-scene 
        mindar-image="imageTargetSrc: ./targets.mind; uiScanning: no;" 
        vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
        
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity id="my-target" mindar-image-target="targetIndex: 0">
            <a-ring color="#ff0080" radius-inner="0.48" radius-outer="0.5" 
                    animation="property: scale; from: 1 1 1; to: 1.2 1.2 1.2; dir: alternate; dur: 1000; loop: true">
            </a-ring>
        </a-entity>
    </a-scene>

    <script>
        const targetElement = document.querySelector('#my-target');
        const btn = document.querySelector('#scan-button');
        const loader = document.querySelector('#loading-screen');
        const container = document.querySelector('#pdf-container');
        const frame = document.querySelector('#pdf-frame');

        window.addEventListener('load', () => {
            setTimeout(() => {
                loader.style.opacity = '0';
                setTimeout(() => loader.style.display = 'none', 1500);
            }, 2000);
        });

        targetElement.addEventListener("targetFound", () => {
            btn.style.display = "block";
        });

        btn.addEventListener("click", () => {
            const pdfUrl = window.location.href.replace('index.html', '') + "database.pdf";
            frame.src = "https://docs.google.com/viewer?url=" + encodeURIComponent(pdfUrl) + "&embedded=true";
            container.style.display = "block";
        });

        document.querySelector('#close-btn').addEventListener("click", () => {
            container.style.display = "none";
            frame.src = "";
        });
    </script>
</body>
</html>

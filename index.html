<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR PDF Scanner</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
        body { margin: 0; overflow: hidden; }
    </style>
</head>
<body>
    <a-scene 
        mindar-image="imageTargetSrc: ./targets.mind; uiScanning: yes;" 
        color-space="sRGB" 
        renderer="colorManagement: true, physicallyCorrectLights" 
        vr-mode-ui="enabled: false" 
        device-orientation-permission-ui="enabled: false">
        
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity id="my-target" mindar-image-target="targetIndex: 0">
            <a-plane color="#00ff00" opacity="0.3" position="0 0 0" height="1" width="1"></a-plane>
        </a-entity>
    </a-scene>

    <script>
        const targetElement = document.querySelector('#my-target');
        
        const pdfUrl = "https://drive.google.com/uc?export=download&id=1uPtcyLic9Y8UyIeX22NcXWtj310JgnUc";

        targetElement.addEventListener("targetFound", event => {
            console.log("Image detected! Redirecting to PDF...");
            window.location.href = pdfUrl;
        });
    </script>
</body>
</html>

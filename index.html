<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Missoni Activewear - AR Experience</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
        body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; }
        #ui-overlay {
            position: absolute; width: 100%; top: 20px; text-align: center;
            color: white; z-index: 10; text-shadow: 2px 2px 4px #000;
        }
        #pdf-viewer {
            display: none; position: fixed; top: 0; left: 0; 
            width: 100%; height: 100%; z-index: 20; border: none;
        }
    </style>
</head>
<body>
    <div id="ui-overlay">Scan the Missoni Image to View the Catalog</div>
    
    <iframe id="pdf-viewer" src=""></iframe>

    <a-scene 
        mindar-image="imageTargetSrc: ./targets.mind; uiScanning: yes;" 
        color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" 
        vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
        
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity id="my-target" mindar-image-target="targetIndex: 0">
            <a-plane color="#ff0080" opacity="0.5" position="0 0 0" height="1" width="1"></a-plane>
        </a-entity>
    </a-scene>

    <script>
        const targetElement = document.querySelector('#my-target');
        const viewer = document.querySelector('#pdf-viewer');

        targetElement.addEventListener("targetFound", event => {
            viewer.src = "./database.pdf";
            viewer.style.display = "block";
            
            document.getElementById('ui-overlay').style.display = 'none';
        });
    </script>
</body>
</html>

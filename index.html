<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Missoni - AR Scanner</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
        body { margin: 0; overflow: hidden; }
        /* Simple loading text for the user */
        #ui-overlay {
            position: absolute; width: 100%; top: 20px; text-align: center;
            color: white; font-family: sans-serif; z-index: 10;
            text-shadow: 2px 2px 4px #000;
        }
    </style>
</head>
<body>
    <div id="ui-overlay">Point camera at the image to view the Database</div>

    <a-scene 
        mindar-image="imageTargetSrc: ./targets.mind; uiScanning: yes;" 
        color-space="sRGB" 
        renderer="colorManagement: true, physicallyCorrectLights" 
        vr-mode-ui="enabled: false" 
        device-orientation-permission-ui="enabled: false">
        
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity id="my-target" mindar-image-target="targetIndex: 0">
            <a-plane color="#00ff00" opacity="0.3" position="0 0 0" height="1" width="1"></a-plane>
        </a-entity>
    </a-scene>

    <script>
        const targetElement = document.querySelector('#my-target');

        targetElement.addEventListener("targetFound", event => {
            console.log("Target detected. Opening local PDF...");
            
            window.location.href = "./database.pdf";
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Missoni Activewear - AR</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Helvetica', sans-serif; }
        
        /* The button that pops up after scanning */
        #scan-button {
            display: none; /* Hidden until scan is successful */
            position: fixed;
            bottom: 10%;
            left: 50%;
            transform: translateX(-50%);
            padding: 15px 30px;
            background-color: #ff0080; /* Missoni Pink */
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 18px;
            font-weight: bold;
            z-index: 100;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            cursor: pointer;
        }

        #ui-overlay {
            position: absolute; width: 100%; top: 20px; text-align: center;
            color: white; z-index: 10; text-shadow: 2px 2px 4px #000;
        }
    </style>
</head>
<body>
    <div id="ui-overlay">Scan the Missoni Image</div>
    
    <button id="scan-button">VIEW CATALOG</button>

    <a-scene 
        mindar-image="imageTargetSrc: ./targets.mind; uiScanning: yes;" 
        vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
        
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity id="my-target" mindar-image-target="targetIndex: 0">
            <a-ring color="#ff0080" radius-inner="0.4" radius-outer="0.5" position="0 0 0"></a-ring>
        </a-entity>
    </a-scene>

    <script>
        const targetElement = document.querySelector('#my-target');
        const btn = document.querySelector('#scan-button');

        targetElement.addEventListener("targetFound", event => {
            console.log("Found it!");
            btn.style.display = "block";
            document.getElementById('ui-overlay').innerHTML = "Image Recognized!";
        });

        btn.addEventListener("click", () => {
            window.location.href = "./database.pdf";
        });
    </script>
</body>
</html>
